name: Build & Release Desktop App

# Builds the Electron desktop app natively on real Windows and macOS
# runners (avoids all the Wine/cross-build limitations of building from a
# non-Windows, non-macOS machine) and publishes the installers straight to
# the matching GitHub Release.
#
# Triggers:
#   - Pushing a version tag (v1.0.0, v1.2.3, ...) builds + publishes that
#     release automatically.
#   - Manual "Run workflow" lets you rebuild/republish an existing tag
#     on demand (e.g. to pick up a packaging fix without cutting a new
#     version).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach installers to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Bundle the VC++ runtime DLLs (self-contained native deps)
        # smartspectra_capi.dll's own dependency tree (verified by parsing every
        # DLL's PE import table, not guessed) needs more than the original 4
        # files -- smartspectra.dll itself imports MSVCP140_ATOMIC_WAIT.dll (a
        # separate file shipped alongside msvcp140.dll in the modern VC++
        # redistributable, added for C++20 atomic wait/notify support), which
        # earlier builds never copied.
        #
        # Two prior attempts at this step didn't work: System32-only (v1.0.0-ci4)
        # didn't have the file, and a two-stage "find x64 dirs under Program
        # Files\Microsoft Visual Studio, then filter to \Redist\MSVC\"
        # search (v1.0.0-ci5) *also* came up empty even though it ran without
        # error -- confirmed by extracting both shipped installers directly and
        # finding the file still absent both times. Rather than guess a third
        # directory-search shape blind, this uses vswhere.exe -- the tool
        # Microsoft ships specifically so scripts don't have to guess VS
        # install layout -- to ask Visual Studio directly where its redist
        # payload lives, which is also the exact mechanism MSBuild itself uses
        # to populate $(VCToolsRedistDir). Every step below writes a
        # ::notice::/::warning:: workflow annotation (visible on the Actions
        # run summary without needing to open the raw job log) so if this
        # *still* doesn't find it, the next round trip has real data instead
        # of another blind guess.
        shell: pwsh
        run: |
          $dest = "node_modules/@smartspectra/node-sdk-win32-x64"
          $files = @(
            "MSVCP140.dll", "MSVCP140_1.dll", "MSVCP140_2.dll",
            "MSVCP140_ATOMIC_WAIT.dll", "MSVCP140_CODECVT_IDS.dll",
            "VCRUNTIME140.dll", "VCRUNTIME140_1.dll", "VCRUNTIME140_THREADS.dll",
            "CONCRT140.dll", "VCCORLIB140.dll"
          )

          $searchRoots = @("C:\Windows\System32")

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsInstalls = & $vswhere -products * -property installationPath
            Write-Host "::notice::vswhere found VS installs: $($vsInstalls -join '; ')"
            foreach ($vsPath in $vsInstalls) {
              # This is the exact file MSBuild itself reads to populate
              # $(VCToolsRedistDir) -- not a guess about folder naming.
              $verFile = Join-Path $vsPath "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
              if (Test-Path $verFile) {
                $ver = (Get-Content $verFile | Select-Object -First 1).Trim()
                $redistDir = Join-Path $vsPath "VC\Redist\MSVC\$ver\x64"
                Write-Host "::notice::Redist version file says $ver -- redist dir: $redistDir (exists: $(Test-Path $redistDir))"
                if (Test-Path $redistDir) { $searchRoots += $redistDir }
              } else {
                Write-Host "::warning::No VCRedistVersion file at $verFile"
              }
            }
          } else {
            Write-Host "::warning::vswhere.exe not found at $vswhere"
          }

          # Last-resort fallback: brute-force recursive search for each exact
          # filename under both possible Program Files roots. Slower, but
          # covers this even if vswhere/the version-file approach above finds
          # nothing (e.g. a runner-image layout change).
          foreach ($pf in @("C:\Program Files\Microsoft Visual Studio", "C:\Program Files (x86)\Microsoft Visual Studio")) {
            if (Test-Path $pf) { $searchRoots += $pf }
          }

          Write-Host "::notice::Final search roots: $($searchRoots -join ' | ')"

          foreach ($f in $files) {
            $found = $null
            foreach ($root in $searchRoots) {
              if (-not (Test-Path $root)) { continue }
              $candidate = Get-ChildItem -Path $root -Filter $f -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($candidate) { $found = $candidate.FullName; break }
            }
            if ($found) {
              Copy-Item $found (Join-Path $dest $f) -Force
              Write-Host "::notice::Bundled $f from $found"
            } else {
              Write-Host "::warning::$f not found anywhere searched on this runner -- skipping"
            }
          }

      - name: Build web bundle
        run: npm run build

      - name: Remove stale Windows installer assets before republishing
        # electron-builder's GitHub publish does NOT reliably replace an
        # asset of the same name on an existing (non-draft) release -- this
        # is the actual reason builds v1.0.0-ci5 and v1.0.0-ci6 both reported
        # "success" yet the downloaded installer never actually changed
        # (confirmed: the release-asset blob ID behind the download link was
        # byte-identical across ci4, ci5, and ci6 -- every fix since ci4 was
        # silently never published). Deleting the old asset first guarantees
        # this run's upload actually lands instead of no-op'ing on a name
        # conflict. continue-on-error covers the first-ever run, where the
        # asset doesn't exist yet to delete.
        shell: pwsh
        run: |
          $names = gh release view v1.0.0 --repo DanielEnis01/Callback --json assets --jq ".assets[].name" 2>$null
          foreach ($n in $names) {
            if ($n -match '\.(exe|zip)$') {
              Write-Host "::notice::Deleting stale asset: $n"
              gh release delete-asset v1.0.0 $n --repo DanielEnis01/Callback -y
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build and publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Remove stale macOS installer assets before republishing
        # Same non-replacement issue as the Windows job's equivalent step --
        # see its comment for the full story.
        shell: bash
        run: |
          names=$(gh release view v1.0.0 --repo DanielEnis01/Callback --json assets --jq '.assets[].name' 2>/dev/null || true)
          for n in $names; do
            case "$n" in
              *.dmg)
                # .dmg only, deliberately NOT .zip -- the Windows job also
                # produces a .zip target and runs in parallel with this one;
                # matching .zip here too would race it and could delete the
                # Windows zip mid-upload.
                echo "::notice::Deleting stale asset: $n"
                gh release delete-asset v1.0.0 "$n" --repo DanielEnis01/Callback -y || true
                ;;
            esac
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build and publish macOS dmg
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
