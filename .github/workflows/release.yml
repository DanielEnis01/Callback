name: Build & Release Desktop App

# Builds the Electron desktop app natively on real Windows and macOS
# runners (avoids all the Wine/cross-build limitations of building from a
# non-Windows, non-macOS machine) and publishes the installers straight to
# the matching GitHub Release.
#
# Triggers:
#   - Pushing a version tag (v1.0.0, v1.2.3, ...) builds + publishes that
#     release automatically.
#   - Manual "Run workflow" lets you rebuild/republish an existing tag
#     on demand (e.g. to pick up a packaging fix without cutting a new
#     version).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach installers to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Bundle the VC++ runtime DLLs (self-contained native deps)
        # smartspectra_capi.dll's own dependency tree (verified by parsing every
        # DLL's PE import table, not guessed) needs more than the original 4
        # files -- smartspectra.dll itself imports MSVCP140_ATOMIC_WAIT.dll (a
        # separate file shipped alongside msvcp140.dll in the modern VC++
        # redistributable, added for C++20 atomic wait/notify support), which
        # earlier builds never copied.
        #
        # Two prior attempts at this step didn't work: System32-only (v1.0.0-ci4)
        # didn't have the file, and a two-stage "find x64 dirs under Program
        # Files\Microsoft Visual Studio, then filter to \Redist\MSVC\"
        # search (v1.0.0-ci5) *also* came up empty even though it ran without
        # error -- confirmed by extracting both shipped installers directly and
        # finding the file still absent both times. Rather than guess a third
        # directory-search shape blind, this uses vswhere.exe -- the tool
        # Microsoft ships specifically so scripts don't have to guess VS
        # install layout -- to ask Visual Studio directly where its redist
        # payload lives, which is also the exact mechanism MSBuild itself uses
        # to populate $(VCToolsRedistDir). Every step below writes a
        # ::notice::/::warning:: workflow annotation (visible on the Actions
        # run summary without needing to open the raw job log) so if this
        # *still* doesn't find it, the next round trip has real data instead
        # of another blind guess.
        shell: pwsh
        run: |
          $dest = "node_modules/@smartspectra/node-sdk-win32-x64"
          $files = @(
            "MSVCP140.dll", "MSVCP140_1.dll", "MSVCP140_2.dll",
            "MSVCP140_ATOMIC_WAIT.dll", "MSVCP140_CODECVT_IDS.dll",
            "VCRUNTIME140.dll", "VCRUNTIME140_1.dll", "VCRUNTIME140_THREADS.dll",
            "CONCRT140.dll", "VCCORLIB140.dll"
          )

          $searchRoots = @("C:\Windows\System32")

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsInstalls = & $vswhere -products * -property installationPath
            Write-Host "::notice::vswhere found VS installs: $($vsInstalls -join '; ')"
            foreach ($vsPath in $vsInstalls) {
              # This is the exact file MSBuild itself reads to populate
              # $(VCToolsRedistDir) -- not a guess about folder naming.
              $verFile = Join-Path $vsPath "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
              if (Test-Path $verFile) {
                $ver = (Get-Content $verFile | Select-Object -First 1).Trim()
                $redistDir = Join-Path $vsPath "VC\Redist\MSVC\$ver\x64"
                Write-Host "::notice::Redist version file says $ver -- redist dir: $redistDir (exists: $(Test-Path $redistDir))"
                if (Test-Path $redistDir) { $searchRoots += $redistDir }
              } else {
                Write-Host "::warning::No VCRedistVersion file at $verFile"
              }
            }
          } else {
            Write-Host "::warning::vswhere.exe not found at $vswhere"
          }

          # Last-resort fallback: brute-force recursive search for each exact
          # filename under both possible Program Files roots. Slower, but
          # covers this even if vswhere/the version-file approach above finds
          # nothing (e.g. a runner-image layout change).
          foreach ($pf in @("C:\Program Files\Microsoft Visual Studio", "C:\Program Files (x86)\Microsoft Visual Studio")) {
            if (Test-Path $pf) { $searchRoots += $pf }
          }

          Write-Host "::notice::Final search roots: $($searchRoots -join ' | ')"

          foreach ($f in $files) {
            $found = $null
            foreach ($root in $searchRoots) {
              if (-not (Test-Path $root)) { continue }
              $candidate = Get-ChildItem -Path $root -Filter $f -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($candidate) { $found = $candidate.FullName; break }
            }
            if ($found) {
              Copy-Item $found (Join-Path $dest $f) -Force
              Write-Host "::notice::Bundled $f from $found"
            } else {
              Write-Host "::warning::$f not found anywhere searched on this runner -- skipping"
            }
          }

      - name: Build web bundle
        run: npm run build

      - name: Build Windows installer (local only, no auto-publish)
        # electron-builder's own --publish flow turned out to be the deeper
        # problem, not just the same-name-asset issue the previous commit
        # addressed: ci7 (which added the delete-old-asset step) reported
        # "success" and even deleted the previous installer, but the new
        # ~220MB .exe never actually finished uploading -- confirmed by
        # checking the release directly afterward: only the small metadata
        # files electron-builder also generates (latest.yml, .blockmap) made
        # it up, the installer itself 404'd. Building locally here and
        # uploading explicitly below with `gh release upload`, the same tool
        # GitHub itself recommends for CI asset uploads, sidesteps whatever
        # is unreliable about electron-builder's own large-file publish path.
        shell: pwsh
        run: |
          $output = (npx electron-builder --win --publish never 2>&1 | Out-String)
          $flat = ($output -replace "`r`n", ' | ' -replace "`n", ' | ').Trim()
          if ($flat.Length -gt 3500) { $flat = "..." + $flat.Substring($flat.Length - 3500) }
          Write-Host "::notice::electron-builder --win exit=$LASTEXITCODE tail=$flat"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::electron-builder --win failed (exit ${LASTEXITCODE}): $flat"
            exit 1
          }

      - name: Upload Windows installer to the v1.0.0 release
        # --clobber replaces an existing asset of the same name in one step,
        # so this also removes the need for the separate delete-first step a
        # previous commit added. This step failed on v1.0.0-ci8 with only a
        # bare "exit code 1" visible (the actual gh error is in the raw job
        # log, which needs authenticated access this session doesn't have) --
        # so this version explicitly captures and prints gh's own output and
        # the release/ directory listing as ::error:: annotations, which ARE
        # visible on the run summary without auth, so the real cause shows up
        # here instead of a dead end.
        shell: pwsh
        run: |
          $listing = (Get-ChildItem release -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', '
          Write-Host "::notice::release/ contents: $listing"
          $output = gh release upload v1.0.0 "release/Callback-Setup-1.0.0.exe" "release/Callback-1.0.0-win.zip" --clobber --repo DanielEnis01/Callback 2>&1 | Out-String
          # Workflow commands (::notice::/::error::) must be a single line --
          # gh's output can contain newlines, which would otherwise silently
          # break the annotation (this is very likely why v1.0.0-ci9's error
          # annotation carried no useful detail despite this same code being
          # present). Collapsing them to " | " keeps it one line so it
          # actually renders.
          $flat = ($output -replace "`r`n", ' | ' -replace "`n", ' | ').Trim()
          Write-Host "::notice::gh upload exit=$LASTEXITCODE output=$flat"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::gh release upload failed (exit ${LASTEXITCODE}): $flat"
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Build macOS dmg (local only, no auto-publish)
        # See the Windows job's equivalent step for why: electron-builder's
        # own --publish flow was silently failing to complete large-file
        # uploads while still exiting 0.
        shell: bash
        run: |
          set +e
          output=$(npx electron-builder --mac --publish never 2>&1)
          status=$?
          set -e
          flat=$(echo "$output" | tr '\n' '|')
          if [ ${#flat} -gt 3500 ]; then
            flat="...${flat: -3500}"
          fi
          echo "::notice::electron-builder --mac exit=$status tail=$flat"
          if [ $status -ne 0 ]; then
            echo "::error::electron-builder --mac failed (exit $status): $flat"
            exit 1
          fi

      - name: Upload macOS dmg to the v1.0.0 release
        # See the Windows job's equivalent step: v1.0.0-ci8 failed here too
        # with only a bare "exit code 1" visible, so this captures gh's own
        # output as an ::error:: annotation instead of leaving a dead end.
        shell: bash
        run: |
          echo "::notice::release/ contents: $(ls release/ 2>&1 | tr '\n' ' ')"
          output=$(gh release upload v1.0.0 release/*.dmg --clobber --repo DanielEnis01/Callback 2>&1)
          status=$?
          flat=$(echo "$output" | tr '\n' '|')
          echo "::notice::gh upload exit=$status output=$flat"
          if [ $status -ne 0 ]; then
            echo "::error::gh release upload failed (exit $status): $flat"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
